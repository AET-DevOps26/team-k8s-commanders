name: AI Assistant Tests

on:
  push:
    paths:
      - "services/ai-assistant/**"
      - ".github/workflows/ai-assistant-tests.yml"
  pull_request:
    paths:
      - "services/ai-assistant/**"
      - ".github/workflows/ai-assistant-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-assistant
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests
