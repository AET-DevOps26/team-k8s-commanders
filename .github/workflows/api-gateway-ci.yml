name: API Gateway CI

on:
  push:
    paths:
      - "services/api-gateway/**"
      - "config/spotbugs/**"
      - "pom.xml"
      - ".github/workflows/api-gateway-ci.yml"
  pull_request:
    paths:
      - "services/api-gateway/**"
      - "config/spotbugs/**"
      - "pom.xml"
      - ".github/workflows/api-gateway-ci.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Run tests and SpotBugs static analysis
        run: mvn -B verify
        working-directory: services/api-gateway

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-gateway-verification-reports
          path: |
            services/api-gateway/target/surefire-reports/
            services/api-gateway/target/spotbugsXml.xml
          retention-days: 7
