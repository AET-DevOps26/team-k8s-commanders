name: API Gateway CI

on:
  push:
    paths:
      - "services/api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"
  pull_request:
    paths:
      - "services/api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests and SpotBugs static analysis
        run: mvn -B verify
        working-directory: services/api-gateway

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-surefire-reports
          path: services/api-gateway/target/surefire-reports/
          retention-days: 7
