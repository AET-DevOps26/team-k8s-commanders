name: API Gateway CI

on:
  push:
    paths:
      - "services/api-gateway/**"
      - "config/spotbugs/**"
      - "pom.xml"
      - ".github/workflows/api-gateway-ci.yml"
      - ".github/scripts/write-jacoco-summary.sh"
  pull_request:
    paths:
      - "services/api-gateway/**"
      - "config/spotbugs/**"
      - "pom.xml"
      - ".github/workflows/api-gateway-ci.yml"
      - ".github/scripts/write-jacoco-summary.sh"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Run tests and SpotBugs static analysis
        run: mvn -B verify
        working-directory: services/api-gateway

      - name: Display JaCoCo coverage
        if: always()
        run: bash .github/scripts/write-jacoco-summary.sh "API Gateway" "services/api-gateway/target/site/jacoco/jacoco.csv"

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-gateway-jacoco-report
          path: services/api-gateway/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-gateway-verification-reports
          path: |
            services/api-gateway/target/surefire-reports/
            services/api-gateway/target/spotbugsXml.xml
          retention-days: 7
