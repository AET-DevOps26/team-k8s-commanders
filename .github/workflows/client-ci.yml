name: Client CI

on:
  push:
    paths:
      - 'web-client/**'
      - 'api/openapi.yaml'
      - '.github/workflows/client-ci.yml'
      - '.github/scripts/write-vitest-coverage-summary.mjs'
  pull_request:
    paths:
      - 'web-client/**'
      - 'api/openapi.yaml'
      - '.github/workflows/client-ci.yml'
      - '.github/scripts/write-vitest-coverage-summary.mjs'

jobs:
  lint-test-build:
    name: Lint, test, and build client
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install generator dependencies
        working-directory: .
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Lint client
        run: npm run lint

      - name: Test client
        run: npm run test:coverage

      - name: Display client coverage
        if: always()
        run: node ../.github/scripts/write-vitest-coverage-summary.mjs coverage/coverage-summary.json "Web client"

      - name: Upload client coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-client-coverage-report
          path: web-client/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Build client
        run: npm run build
