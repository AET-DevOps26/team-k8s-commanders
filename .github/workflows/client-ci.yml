name: Client CI

on:
  push:
    paths:
      - 'web-client/**'
      - 'api/openapi.yaml'
      - '.github/workflows/client-ci.yml'
  pull_request:
    paths:
      - 'web-client/**'
      - 'api/openapi.yaml'
      - '.github/workflows/client-ci.yml'

jobs:
  lint-test-build:
    name: Lint, test, and build client
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install generator dependencies
        working-directory: .
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Lint client
        run: npm run lint

      - name: Test client
        run: npm run test:run

      - name: Build client
        run: npm run build
