name: Deploy to Azure

on:
  workflow_run:
    workflows: ["Build and Publish Images"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docker-compose.prod.yml"
      - "infra/caddy/**"
      - "infra/prometheus/**"
      - "infra/grafana/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: Azure
      url: "https://${{ vars.AZURE_PUBLIC_IP }}.nip.io"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Build the env file in the runner's own shell (full control, no SSH
      # env-forwarding quirks). Values come through `env:` and are written with
      # printf '%s' so quotes/newlines/$ in secrets stay literal. umask 077
      # creates the file 0600 so it isn't world-readable on the VM.
      - name: Generate .env.prod
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          OPENWEBUI_BASE_URL: ${{ vars.OPENWEBUI_BASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AUTH_DB_NAME: ${{ vars.AUTH_DB_NAME }}
          AUTH_DB_USER: ${{ vars.AUTH_DB_USER }}
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
          AUTH_DDL_AUTO: ${{ vars.AUTH_DDL_AUTO }}
          PATIENT_DB_NAME: ${{ vars.PATIENT_DB_NAME }}
          PATIENT_DB_USER: ${{ vars.PATIENT_DB_USER }}
          PATIENT_DB_PASSWORD: ${{ secrets.PATIENT_DB_PASSWORD }}
          PATIENT_DDL_AUTO: ${{ vars.PATIENT_DDL_AUTO }}
          NOTES_DB_NAME: ${{ vars.NOTES_DB_NAME }}
          NOTES_DB_USER: ${{ vars.NOTES_DB_USER }}
          NOTES_DB_PASSWORD: ${{ secrets.NOTES_DB_PASSWORD }}
          NOTES_DDL_AUTO: ${{ vars.NOTES_DDL_AUTO }}
          NOTIFICATION_DB_NAME: ${{ vars.NOTIFICATION_DB_NAME }}
          NOTIFICATION_DB_USER: ${{ vars.NOTIFICATION_DB_USER }}
          NOTIFICATION_DB_PASSWORD: ${{ secrets.NOTIFICATION_DB_PASSWORD }}
          NOTIFICATION_DDL_AUTO: ${{ vars.NOTIFICATION_DDL_AUTO }}
          AI_DB_NAME: ${{ vars.AI_DB_NAME }}
          AI_DB_USER: ${{ vars.AI_DB_USER }}
          AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
          AI_DDL_AUTO: ${{ vars.AI_DDL_AUTO }}
          GRAFANA_ADMIN_USER: ${{ vars.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_ROOT_URL: "https://${{ vars.AZURE_PUBLIC_IP }}.nip.io/grafana"
          # Caddy TLS: hostname to request the Let's Encrypt cert for, and the
          # ACME CA endpoint. ACME_CA defaults to staging (in compose) when
          # this var is empty; set it to the prod endpoint once verified.
          SITE_ADDRESS: "${{ vars.AZURE_PUBLIC_IP }}.nip.io"
          ACME_CA: ${{ vars.ACME_CA }}
        run: |
          umask 077
          rm -f .env.prod

          # write_var NAME VALUE [required]
          # Appends NAME=VALUE to .env.prod. Fails fast (before deploy) when a
          # `required` value is empty, giving a clearer/earlier error than the
          # compose ${VAR:?} guards. Rejects values containing a newline: printf
          # is line-oriented, so a stray newline in a secret would spill extra
          # lines into .env.prod and corrupt the file.
          write_var() {
            local name=$1 value=$2 required=$3
            if [ "$required" = required ] && [ -z "$value" ]; then
              echo "::error::Required variable $name is empty" >&2
              exit 1
            fi
            case $value in
              *$'\n'*)
                echo "::error::Variable $name contains a newline; refusing to write .env.prod" >&2
                exit 1
                ;;
            esac
            printf '%s=%s\n' "$name" "$value" >> .env.prod
          }

          write_var LLM_API_KEY "$LLM_API_KEY" required
          write_var LLM_PROVIDER "$LLM_PROVIDER" required
          write_var LLM_MODEL "$LLM_MODEL" required
          write_var OPENWEBUI_BASE_URL "$OPENWEBUI_BASE_URL"
          write_var PUBLIC_API_URL "/api/v1"
          write_var JWT_SECRET "$JWT_SECRET" required
          write_var AUTH_DB_NAME "$AUTH_DB_NAME" required
          write_var AUTH_DB_USER "$AUTH_DB_USER" required
          write_var AUTH_DB_PASSWORD "$AUTH_DB_PASSWORD" required
          write_var AUTH_DDL_AUTO "$AUTH_DDL_AUTO"
          write_var PATIENT_DB_NAME "$PATIENT_DB_NAME" required
          write_var PATIENT_DB_USER "$PATIENT_DB_USER" required
          write_var PATIENT_DB_PASSWORD "$PATIENT_DB_PASSWORD" required
          write_var PATIENT_DDL_AUTO "$PATIENT_DDL_AUTO"
          write_var NOTES_DB_NAME "$NOTES_DB_NAME" required
          write_var NOTES_DB_USER "$NOTES_DB_USER" required
          write_var NOTES_DB_PASSWORD "$NOTES_DB_PASSWORD" required
          write_var NOTES_DDL_AUTO "$NOTES_DDL_AUTO"
          write_var NOTIFICATION_DB_NAME "$NOTIFICATION_DB_NAME" required
          write_var NOTIFICATION_DB_USER "$NOTIFICATION_DB_USER" required
          write_var NOTIFICATION_DB_PASSWORD "$NOTIFICATION_DB_PASSWORD" required
          write_var NOTIFICATION_DDL_AUTO "$NOTIFICATION_DDL_AUTO"
          write_var AI_DB_NAME "$AI_DB_NAME" required
          write_var AI_DB_USER "$AI_DB_USER" required
          write_var AI_DB_PASSWORD "$AI_DB_PASSWORD" required
          write_var AI_DDL_AUTO "$AI_DDL_AUTO"
          write_var GRAFANA_ADMIN_USER "$GRAFANA_ADMIN_USER"
          write_var GRAFANA_ADMIN_PASSWORD "$GRAFANA_ADMIN_PASSWORD" required
          write_var GRAFANA_ROOT_URL "$GRAFANA_ROOT_URL"
          write_var SITE_ADDRESS "$SITE_ADDRESS" required
          write_var ACME_CA "$ACME_CA"

      - name: Copy compose file, infra configs and env file to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.AZURE_PUBLIC_IP }}
          username: ${{ vars.AZURE_USER }}
          key: ${{ secrets.AZURE_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,infra/caddy/,infra/prometheus/,infra/grafana/,.env.prod"
          target: /home/${{ vars.AZURE_USER }}

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.AZURE_PUBLIC_IP }}
          username: ${{ vars.AZURE_USER }}
          key: ${{ secrets.AZURE_PRIVATE_KEY }}
          script: |
            # Caddy provisions and auto-renews the Let's Encrypt certificate
            # for $SITE_ADDRESS on startup — no manual cert generation needed.
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml --env-file .env.prod up --pull=always -d --force-recreate --remove-orphans
