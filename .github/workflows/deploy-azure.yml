name: Deploy to Azure

on:
  workflow_run:
    workflows: ["Build and Publish Images"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docker-compose.prod.yml"
      - "infra/nginx/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: Azure
      url: "https://${{ vars.AZURE_PUBLIC_IP }}.nip.io"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy compose file and nginx config to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.AZURE_PUBLIC_IP }}
          username: ${{ vars.AZURE_USER }}
          key: ${{ secrets.AZURE_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,infra/nginx/"
          target: /home/${{ vars.AZURE_USER }}

      - name: Create .env.prod on VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.AZURE_PUBLIC_IP }}
          username: ${{ vars.AZURE_USER }}
          key: ${{ secrets.AZURE_PRIVATE_KEY }}
          script: |
            rm -f .env.prod
            echo "LLM_API_KEY=${{ secrets.LLM_API_KEY }}" >> .env.prod
            echo "LLM_PROVIDER=${{ vars.LLM_PROVIDER }}" >> .env.prod
            echo "LLM_MODEL=${{ vars.LLM_MODEL }}" >> .env.prod
            echo "OPENWEBUI_BASE_URL=${{ vars.OPENWEBUI_BASE_URL }}" >> .env.prod
            echo "PUBLIC_API_URL=/api/v1" >> .env.prod
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.prod
            echo "AUTH_DB_NAME=${{ vars.AUTH_DB_NAME }}" >> .env.prod
            echo "AUTH_DB_USER=${{ vars.AUTH_DB_USER }}" >> .env.prod
            echo "AUTH_DB_PASSWORD=${{ secrets.AUTH_DB_PASSWORD }}" >> .env.prod
            echo "AUTH_DDL_AUTO=${{ vars.AUTH_DDL_AUTO }}" >> .env.prod
            echo "PATIENT_DB_NAME=${{ vars.PATIENT_DB_NAME }}" >> .env.prod
            echo "PATIENT_DB_USER=${{ vars.PATIENT_DB_USER }}" >> .env.prod
            echo "PATIENT_DB_PASSWORD=${{ secrets.PATIENT_DB_PASSWORD }}" >> .env.prod
            echo "PATIENT_DDL_AUTO=${{ vars.PATIENT_DDL_AUTO }}" >> .env.prod
            echo "NOTES_DB_NAME=${{ vars.NOTES_DB_NAME }}" >> .env.prod
            echo "NOTES_DB_USER=${{ vars.NOTES_DB_USER }}" >> .env.prod
            echo "NOTES_DB_PASSWORD=${{ secrets.NOTES_DB_PASSWORD }}" >> .env.prod
            echo "NOTES_DDL_AUTO=${{ vars.NOTES_DDL_AUTO }}" >> .env.prod
            echo "AI_DB_NAME=${{ vars.AI_DB_NAME }}" >> .env.prod
            echo "AI_DB_USER=${{ vars.AI_DB_USER }}" >> .env.prod
            echo "AI_DB_PASSWORD=${{ secrets.AI_DB_PASSWORD }}" >> .env.prod
            echo "AI_DDL_AUTO=${{ vars.AI_DDL_AUTO }}" >> .env.prod
            echo "GRAFANA_ADMIN_USER=${{ vars.GRAFANA_ADMIN_USER }}" >> .env.prod
            echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" >> .env.prod

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.AZURE_PUBLIC_IP }}
          username: ${{ vars.AZURE_USER }}
          key: ${{ secrets.AZURE_PRIVATE_KEY }}
          script: |
            # Generate self-signed cert on first deploy
            if [ ! -f certs/server.crt ]; then
              mkdir -p certs
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout certs/server.key \
                -out certs/server.crt \
                -subj "/CN=${{ vars.AZURE_PUBLIC_IP }}.nip.io" \
                -addext "subjectAltName=DNS:${{ vars.AZURE_PUBLIC_IP }}.nip.io"
            fi

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml --env-file .env.prod up --pull=always -d --force-recreate --remove-orphans
