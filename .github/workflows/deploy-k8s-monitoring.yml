name: Deploy Monitoring to AET Cluster

# Deploys the Prometheus + Grafana stack (helm/caredesk-monitoring) into its
# own namespace, separate from the app deploy (deploy-k8s.yml). No workflow_run
# trigger: the stack uses public upstream images, so it never waits on our
# image builds.

on:
  push:
    # TODO: remove the feature branch after merge — it's only here because
    # workflow_dispatch is unavailable until the workflow exists on main.
    branches: [main, 176-switch-k8s-monitoring-to-seperate-namespace]
    paths:
      - 'helm/caredesk-monitoring/**'
      # Dashboards and alert rules are baked into ConfigMaps from infra/grafana
      # (via chart symlinks), so editing them must redeploy the chart.
      - 'infra/grafana/**'
      - '.github/workflows/deploy-k8s-monitoring.yml'
  workflow_dispatch:

# One deploy at a time per monitoring namespace — avoids overlapping helm upgrades.
concurrency:
  group: aet-deploy-monitoring-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: AET
      url: "https://caredesk-monitoring-team-k8s-commanders.student.k8s.aet.cit.tum.de"

    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        env:
          KUBECONFIG_AET: ${{ secrets.KUBECONFIG_AET }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBECONFIG_AET}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      - name: Check namespace quota
        run: |
          NS="team-k8s-commanders-monitoring"
          # First deploy creates the namespace outside the Rancher project; move
          # it into the project afterwards (Rancher UI → Cluster → Projects/
          # Namespaces) so it shares the project-wide quota. Until then it has
          # no ResourceQuota and check-k8s-quota.sh skips gracefully.
          kubectl get ns "${NS}" >/dev/null 2>&1 || kubectl create namespace "${NS}"
          # Chart steady-state limits: Prometheus 150m/512Mi + Grafana 200m/256Mi.
          bash scripts/check-k8s-quota.sh "${NS}" 350 768

      - name: Deploy with Helm
        run: |
          NS="team-k8s-commanders-monitoring"

          SET_FLAGS=()
          if [ -n "${{ secrets.GRAFANA_ADMIN_PASSWORD }}" ]; then
            SET_FLAGS+=(--set "grafana.adminPassword=${{ secrets.GRAFANA_ADMIN_PASSWORD }}")
          fi
          if [ -n "${{ vars.MONITORING_INGRESS_HOST }}" ]; then
            SET_FLAGS+=(--set "ingress.host=${{ vars.MONITORING_INGRESS_HOST }}")
          fi

          if ! helm upgrade --install caredesk-monitoring helm/caredesk-monitoring \
            --namespace "${NS}" \
            "${SET_FLAGS[@]}" \
            --wait --timeout 5m; then
            echo "::error::Helm upgrade failed — collecting cluster diagnostics"
            kubectl -n "${NS}" get pods,deploy,rs
            kubectl -n "${NS}" get events --sort-by='.lastTimestamp' | tail -25
            kubectl -n "${NS}" describe resourcequota || true
            exit 1
          fi

      - name: Smoke test
        run: |
          NS="team-k8s-commanders-monitoring"
          kubectl -n "${NS}" get pods,svc,ingress
          helm get notes caredesk-monitoring -n "${NS}" || true
