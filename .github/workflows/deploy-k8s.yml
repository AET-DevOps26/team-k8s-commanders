name: Deploy to AET Cluster

on:
  workflow_run:
    workflows: ["Build and Publish Images"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      # Monitoring (helm/caredesk-monitoring + infra/grafana) deploys via
      # .github/workflows/deploy-k8s-monitoring.yml instead.
      - 'helm/caredesk/**'
      - '.github/workflows/deploy-k8s.yml'
  workflow_dispatch:

# One deploy at a time per team namespace — avoids overlapping helm upgrades.
concurrency:
  group: aet-deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    # Only run when the upstream Publish Images workflow succeeded (or on manual dispatch).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: AET
      url: "https://caredesk-team-k8s-commanders.student.k8s.aet.cit.tum.de"

    steps:
      - uses: actions/checkout@v7

      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.3

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        env:
          KUBECONFIG_AET: ${{ secrets.KUBECONFIG_AET }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBECONFIG_AET}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      - name: Determine image tag
        id: tag
        run: |
          # Pin sha-<short> after a successful Publish Images run — the only path
          # guaranteed to have built and pushed that tag. Manual workflow_dispatch
          # uses `latest` (last image published from main).
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "tag=sha-${SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check namespace quota
        env:
          # Set in the AET environment as <cluster-id>:<project-id> so a fresh
          # namespace lands directly in the team's Rancher project (shared
          # project quota). See scripts/ensure-k8s-namespace.sh.
          RANCHER_PROJECT_ID: ${{ vars.RANCHER_PROJECT_ID }}
        run: |
          NS="team-k8s-commanders"
          # Reserve this namespace's share of the project quota (chart steady
          # state 3850m/5504Mi plus headroom). The monitoring namespace reserves
          # the remaining 500m/1024Mi of the project's 6000m/8192Mi — keep the
          # two splits summing to at most that total.
          bash scripts/ensure-k8s-namespace.sh "${NS}" 5500m 7168Mi
          bash scripts/check-k8s-quota.sh "${NS}"

      - name: Deploy with Helm
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          INGRESS_HOST: ${{ vars.INGRESS_HOST }}
          OPENWEBUI_BASE_URL: ${{ vars.OPENWEBUI_BASE_URL }}
          ADMIN_NAME: ${{ vars.ADMIN_NAME }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # Single toggle for demo/test data seeding. Set the SEED_DEMO variable
          # to "true" on the AET environment to seed for a demo; leave unset/false
          # otherwise. Never affects the bootstrap admin (always seeded).
          SEED_DEMO: ${{ vars.SEED_DEMO }}
          # The chart ships no default JWT secret / DB password — they must be
          # supplied here (see helm/caredesk secret templates, which `required` them).
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # HTTP basic auth for the public Mailpit UI ingress. The chart ships no
          # defaults (its secret template `required`s them), so the endpoint is
          # never exposed with known credentials — supply them here.
          MAILPIT_BASIC_AUTH_USER: ${{ vars.MAILPIT_BASIC_AUTH_USER }}
          MAILPIT_BASIC_AUTH_HASH: ${{ secrets.MAILPIT_BASIC_AUTH_HASH }}
        run: |
          NS="team-k8s-commanders"

          if [[ -z "${ADMIN_NAME//[[:space:]]/}" ]] || [[ -z "${ADMIN_EMAIL//[[:space:]]/}" ]] || [[ -z "${ADMIN_PASSWORD//[[:space:]]/}" ]]; then
            echo "::error::ADMIN_NAME, ADMIN_EMAIL, and ADMIN_PASSWORD must be configured for production"
            exit 1
          fi

          if [[ -z "${JWT_SECRET//[[:space:]]/}" ]] || [[ -z "${POSTGRES_PASSWORD//[[:space:]]/}" ]]; then
            echo "::error::JWT_SECRET and POSTGRES_PASSWORD secrets must be configured — the chart no longer ships built-in defaults"
            exit 1
          fi

          if [[ -z "${MAILPIT_BASIC_AUTH_USER//[[:space:]]/}" ]] || [[ -z "${MAILPIT_BASIC_AUTH_HASH//[[:space:]]/}" ]]; then
            echo "::error::MAILPIT_BASIC_AUTH_USER (variable) and MAILPIT_BASIC_AUTH_HASH (secret) must be configured — the Mailpit ingress is basic-auth protected with no chart defaults"
            exit 1
          fi

          ADMIN_CONFIG_DIR="${RUNNER_TEMP}/caredesk-admin"
          mkdir -p "${ADMIN_CONFIG_DIR}"
          chmod 700 "${ADMIN_CONFIG_DIR}"
          printf '%s' "${ADMIN_NAME}" > "${ADMIN_CONFIG_DIR}/name"
          printf '%s' "${ADMIN_EMAIL}" > "${ADMIN_CONFIG_DIR}/email"
          printf '%s' "${ADMIN_PASSWORD}" > "${ADMIN_CONFIG_DIR}/password"
          chmod 600 "${ADMIN_CONFIG_DIR}/"*
          trap 'rm -rf "${ADMIN_CONFIG_DIR}"' EXIT

          # Pass JWT_SECRET and POSTGRES_PASSWORD via files + --set-file so
          # secret values with special characters (commas, etc.) can't be
          # mangled by --set list parsing.
          printf '%s' "${JWT_SECRET}" > "${ADMIN_CONFIG_DIR}/jwt-secret"
          printf '%s' "${POSTGRES_PASSWORD}" > "${ADMIN_CONFIG_DIR}/postgres-password"
          # bcrypt hash contains '$' — pass via file so the shell can't expand it
          # and helm --set list parsing can't mangle it.
          printf '%s' "${MAILPIT_BASIC_AUTH_HASH}" > "${ADMIN_CONFIG_DIR}/mailpit-hash"
          chmod 600 "${ADMIN_CONFIG_DIR}/jwt-secret" "${ADMIN_CONFIG_DIR}/postgres-password" "${ADMIN_CONFIG_DIR}/mailpit-hash"

          SET_FLAGS=(
            --set "images.tag=${{ steps.tag.outputs.tag }}"
            --set "ai.secrets.llmApiKey=${{ secrets.LLM_API_KEY }}"
            --set "ai.env.llmProvider=${LLM_PROVIDER}"
            --set "ai.env.llmModel=${LLM_MODEL}"
            --set "auth.bootstrapAdmin.enabled=true"
            --set-file "auth.bootstrapAdmin.name=${ADMIN_CONFIG_DIR}/name"
            --set-file "auth.bootstrapAdmin.email=${ADMIN_CONFIG_DIR}/email"
            --set-file "auth.bootstrapAdmin.password=${ADMIN_CONFIG_DIR}/password"
            --set "seedDemoData=${SEED_DEMO:-false}"
            --set-file "backend.jwtSecret=${ADMIN_CONFIG_DIR}/jwt-secret"
            --set-file "postgres.password=${ADMIN_CONFIG_DIR}/postgres-password"
            --set "mailpit.ingress.basicAuth.user=${MAILPIT_BASIC_AUTH_USER}"
            --set-file "mailpit.ingress.basicAuth.hash=${ADMIN_CONFIG_DIR}/mailpit-hash"
          )

          if [ -n "${OPENWEBUI_BASE_URL}" ]; then
            SET_FLAGS+=(--set "ai.env.openwebuiBaseUrl=${OPENWEBUI_BASE_URL}")
          fi

          if [ -n "${INGRESS_HOST}" ]; then
            SET_FLAGS+=(--set "ingress.host=${INGRESS_HOST}")
          fi

          if ! helm upgrade --install caredesk helm/caredesk \
            --namespace "${NS}" \
            "${SET_FLAGS[@]}" \
            --wait --timeout 10m; then
            echo "::error::Helm upgrade failed — collecting cluster diagnostics"
            kubectl -n "${NS}" get pods,deploy,rs
            kubectl -n "${NS}" get events --sort-by='.lastTimestamp' | tail -25
            kubectl -n "${NS}" describe resourcequota || true
            exit 1
          fi

      - name: Smoke test
        run: |
          NS="team-k8s-commanders"
          kubectl -n "${NS}" get pods,svc,ingress
          helm get notes caredesk -n "${NS}"
