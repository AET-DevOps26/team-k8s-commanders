name: Deploy to AET Cluster

on:
  workflow_run:
    workflows: ["Publish Images"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "helm/**"
      - "scripts/deploy-k8s.sh"
      - ".github/workflows/deploy-k8s.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Only run when the upstream Publish Images workflow succeeded (or on direct triggers)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: AET

    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        env:
          KUBECONFIG_AET: ${{ secrets.KUBECONFIG_AET }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBECONFIG_AET}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      - name: Determine image tag
        id: tag
        run: |
          # Only pin an exact sha-<short> when this run follows a successful
          # Publish Images run — that is the only path guaranteed to have built
          # and pushed that tag. A push touching only helm/** (or a manual
          # workflow_dispatch) does NOT rebuild images, so a sha pin would point
          # at a tag GHCR never built → ImagePullBackOff. Fall back to `latest`
          # (the last image published from main) for those paths.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "tag=sha-${SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy with Helm
        env:
          TUM_ID: ${{ vars.TUM_ID }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          INGRESS_HOST: ${{ vars.INGRESS_HOST }}
        run: |
          NS="${TUM_ID}-devops26"
          kubectl get ns "${NS}" >/dev/null 2>&1 || kubectl create namespace "${NS}"

          SET_FLAGS=(
            --set "tumId=${TUM_ID}"
            --set "images.tag=${{ steps.tag.outputs.tag }}"
            --set "images.pullSecret.username=${{ github.actor }}"
            --set "images.pullSecret.password=${{ secrets.GHCR_PULL_PAT }}"
            --set "ai.secrets.llmApiKey=${{ secrets.LLM_API_KEY }}"
            --set "ai.env.llmProvider=${LLM_PROVIDER}"
            --set "ai.env.llmModel=${LLM_MODEL}"
          )

          if [ -n "${INGRESS_HOST}" ]; then
            SET_FLAGS+=(--set "ingress.host=${INGRESS_HOST}")
          fi

          # The full stack (incl. auth + per-service Postgres) is enabled by
          # chart defaults. Inject real secrets over the dev defaults when set.
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            SET_FLAGS+=(--set "backend.jwtSecret=${{ secrets.JWT_SECRET }}")
          fi
          if [ -n "${{ secrets.POSTGRES_PASSWORD }}" ]; then
            SET_FLAGS+=(--set "postgres.password=${{ secrets.POSTGRES_PASSWORD }}")
          fi

          helm upgrade --install caredesk helm/caredesk \
            --namespace "${NS}" \
            "${SET_FLAGS[@]}" \
            --wait --timeout 5m

      - name: Smoke test
        env:
          TUM_ID: ${{ vars.TUM_ID }}
        run: |
          NS="${TUM_ID}-devops26"
          kubectl -n "${NS}" get pods,svc,ingress
          helm get notes caredesk -n "${NS}"
