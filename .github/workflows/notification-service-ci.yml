name: Notification Service CI

on:
  push:
    paths:
      - "api/openapi.yaml"
      - "services/notification-service/**"
      - "services/common-web/**"
      - "config/spotbugs/**"
      - "pom.xml"
      - ".github/workflows/notification-service-ci.yml"
      - ".github/scripts/write-jacoco-summary.sh"
  pull_request:
    paths:
      - "api/openapi.yaml"
      - "services/notification-service/**"
      - "services/common-web/**"
      - "config/spotbugs/**"
      - "pom.xml"
      - ".github/workflows/notification-service-ci.yml"
      - ".github/scripts/write-jacoco-summary.sh"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install node deps
        run: npm ci

      - name: Generate OpenAPI Spring stubs
        run: ./api/scripts/gen-all.sh

      - name: Install OpenAPI stubs JAR into local Maven repo
        run: |
          cd services/springboot/generated
          mvn -B -q compile
          rm -f target/classes/application.properties
          cd target/classes
          jar cf /tmp/openapi-spring-1.0.0.jar .
          mvn -B -q install:install-file \
            -Dfile=/tmp/openapi-spring-1.0.0.jar \
            -DgroupId=org.openapitools \
            -DartifactId=openapi-spring \
            -Dversion=1.0.0 \
            -Dpackaging=jar

      - name: Install shared web library into local Maven repo
        run: |
          mvn -B -q install -N -Dspotbugs.skip=true -Djacoco.skip=true
          mvn -B -q install -DskipTests -Dspotbugs.skip=true -Djacoco.skip=true -f services/common-web/pom.xml

      - name: Run tests and SpotBugs static analysis
        run: mvn -B verify
        working-directory: services/notification-service

      - name: Display JaCoCo coverage
        if: always()
        run: bash .github/scripts/write-jacoco-summary.sh "Notification Service" "services/notification-service/target/site/jacoco/jacoco.csv"

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-service-jacoco-report
          path: services/notification-service/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: notification-service-verification-reports
          path: |
            services/notification-service/target/surefire-reports/
            services/notification-service/target/spotbugsXml.xml
          retention-days: 7
