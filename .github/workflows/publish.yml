name: Build and Publish Images

on:
  push:
    branches: [main]
    paths:
      - "api/openapi.yaml"
      - "services/ai-assistant/**"
      - "services/auth-service/**"
      - "services/api-gateway/**"
      - "services/patient-service/**"
      - "services/notes-service/**"
      - "web-client/**"
      - ".github/workflows/publish.yml"
  pull_request:
    paths:
      - "api/openapi.yaml"
      - "services/ai-assistant/**"
      - "services/auth-service/**"
      - "services/api-gateway/**"
      - "services/patient-service/**"
      - "services/notes-service/**"
      - "web-client/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

jobs:
  generate-stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - run: npm ci

      - run: ./api/scripts/gen-all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: springboot-generated
          path: services/springboot/generated/
          retention-days: 1

  build:
    needs: generate-stubs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ai-assistant
            context: ./services/ai-assistant
            dockerfile: ./services/ai-assistant/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/ai-assistant
          - service: web-client
            context: .
            dockerfile: ./web-client/Dockerfile
            dockerfile: ./web-client/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/web-client
          # auth-service is built from the repo root so the Dockerfile can reach
          # services/springboot/generated for the OpenAPI stubs JAR.
          - service: auth-service
            context: .
            dockerfile: ./services/auth-service/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/auth-service
          - service: api-gateway
            context: ./services/api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/api-gateway
          # patient-service is built from the repo root for the same reason as
          # auth-service (needs services/springboot/generated for the stubs JAR).
          - service: patient-service
            context: .
            dockerfile: ./services/patient-service/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/patient-service
          # notes-service is built from the repo root for the same reason as
          # auth-service (needs services/springboot/generated for the stubs JAR).
          - service: notes-service
            context: .
            dockerfile: ./services/notes-service/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/notes-service

    steps:
      - uses: actions/checkout@v6

      - name: Download generated Spring stubs
        uses: actions/download-artifact@v4
        with:
          name: springboot-generated
          path: services/springboot/generated/

      - name: Generate image tags
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
