name: Publish Images

on:
  push:
    branches: [main]
    paths:
      - "services/ai-assistant/**"
      - "services/auth-service/**"
      - "web-client/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ai-assistant
            context: ./services/ai-assistant
            dockerfile: ./services/ai-assistant/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/ai-assistant
          - service: web-client
            context: ./web-client
            dockerfile: ./web-client/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/web-client
          - service: auth-service
            context: ./services/auth-service
            dockerfile: ./services/auth-service/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/auth-service

    steps:
      - uses: actions/checkout@v4

      # Skip auth-service silently until its Dockerfile lands on the branch.
      - name: Check Dockerfile presence
        id: check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${{ matrix.service }} — ${{ matrix.dockerfile }} not present."
          fi

      - name: Generate image tags
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Log in to GHCR
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
