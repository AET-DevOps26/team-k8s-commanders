name: Publish Images

on:
  push:
    branches: [main]
    paths:
      - "services/ai-assistant/**"
      - "web-client/**"
      - ".github/workflows/publish.yml"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ai-assistant: ${{ steps.filter.outputs.ai-assistant }}
      web-client: ${{ steps.filter.outputs.web-client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ai-assistant:
              - "services/ai-assistant/**"
            web-client:
              - "web-client/**"

  ai-assistant:
    needs: changes
    if: needs.changes.outputs.ai-assistant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./services/ai-assistant
          push: true
          tags: |
            ghcr.io/aet-devops26/team-k8s-commanders/ai-assistant:latest
            ghcr.io/aet-devops26/team-k8s-commanders/ai-assistant:${{ github.sha }}

  web-client:
    needs: changes
    if: needs.changes.outputs.web-client == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web-client
          push: true
          tags: |
            ghcr.io/aet-devops26/team-k8s-commanders/web-client:latest
            ghcr.io/aet-devops26/team-k8s-commanders/web-client:${{ github.sha }}
