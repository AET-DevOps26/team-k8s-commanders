name: Build and Publish Images

on:
  push:
    branches: [main]
    paths:
      - "api/openapi.yaml"
      - "services/ai-assistant/**"
      - "services/auth-service/**"
      - "services/api-gateway/**"
      - "services/patient-service/**"
      - "services/notes-service/**"
      - "services/notification-service/**"
      - "web-client/**"
      - ".github/workflows/publish.yml"
  pull_request:
    paths:
      - "api/openapi.yaml"
      - "services/ai-assistant/**"
      - "services/auth-service/**"
      - "services/api-gateway/**"
      - "services/patient-service/**"
      - "services/notes-service/**"
      - "services/notification-service/**"
      - "web-client/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

jobs:
  check-generated-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - run: npm ci

      - run: ./api/scripts/gen-all.sh

      - name: Fail if generated stubs are out of sync with the spec
        run: |
          if ! git diff --exit-code services/springboot/generated/src/; then
            echo "services/springboot/generated/src/ is out of sync with api/openapi.yaml."
            echo "Run ./api/scripts/gen-all.sh locally and commit the result."
            exit 1
          fi

  build:
    needs: check-generated-sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ai-assistant
            context: ./services/ai-assistant
            dockerfile: ./services/ai-assistant/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/ai-assistant
          - service: web-client
            context: .
            dockerfile: ./web-client/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/web-client
          # auth-service is built from the repo root so the Dockerfile can reach
          # services/springboot/generated for the OpenAPI stubs JAR.
          - service: auth-service
            context: .
            dockerfile: ./services/auth-service/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/auth-service
          # api-gateway is built from the repo root so the Dockerfile can reach
          # api/openapi.yaml and bundle it (served at /api/v1/openapi.yaml with
          # Swagger UI at /api/v1/docs).
          - service: api-gateway
            context: .
            dockerfile: ./services/api-gateway/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/api-gateway
          # patient-service is built from the repo root for the same reason as
          # auth-service (needs services/springboot/generated for the stubs JAR).
          - service: patient-service
            context: .
            dockerfile: ./services/patient-service/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/patient-service
          # notes-service is built from the repo root for the same reason as
          # auth-service (needs services/springboot/generated for the stubs JAR).
          - service: notes-service
            context: .
            dockerfile: ./services/notes-service/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/notes-service
          # notification-service is built from the repo root for the same reason
          # as auth-service (needs services/springboot/generated for the stubs JAR).
          - service: notification-service
            context: .
            dockerfile: ./services/notification-service/Dockerfile
            image: ghcr.io/aet-devops26/team-k8s-commanders/notification-service

    steps:
      - uses: actions/checkout@v6

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
