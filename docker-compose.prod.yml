services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS must be set}
      # Defaults to Let's Encrypt staging; set ACME_CA to the production
      # endpoint (https://acme-v02.api.letsencrypt.org/directory) for a
      # browser-trusted certificate.
      ACME_CA: ${ACME_CA:-https://acme-staging-v02.api.letsencrypt.org/directory}
      # HTTP basic auth for the public /mailpit UI. Defaults to the dev
      # credentials (mailpit / mailpit) — OVERRIDE in production by setting
      # MAILPIT_BASIC_AUTH_USER and MAILPIT_BASIC_AUTH_HASH (a bcrypt hash).
      MAILPIT_BASIC_AUTH_USER: ${MAILPIT_BASIC_AUTH_USER:-mailpit}
      MAILPIT_BASIC_AUTH_HASH: ${MAILPIT_BASIC_AUTH_HASH:-$$2y$$05$$EKc8Qn8M119jQbj.A2W1JuOfZl3O7QJ7LYyrPikreFIG/BgfgQpPu}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persists issued certificates across deploys — essential to avoid
      # re-requesting from Let's Encrypt on every redeploy (rate limits).
      - caddy-data:/data
      - caddy-config:/config
    restart: always
    depends_on:
      web-client:
        condition: service_started
      api-gateway:
        condition: service_healthy
    networks:
      - caredesk

  web-client:
    image: ghcr.io/aet-devops26/team-k8s-commanders/web-client:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-/api/v1}
    networks:
      - caredesk

  ai-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${AI_DB_NAME:?AI_DB_NAME must be set}
      POSTGRES_USER: ${AI_DB_USER:?AI_DB_USER must be set}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD must be set}
    volumes:
      - ai-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  ai-assistant:
    image: ghcr.io/aet-devops26/team-k8s-commanders/ai-assistant:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      ai-db:
        condition: service_healthy
    environment:
      # Surfaces in the app_info metric — the deployed image tag.
      APP_VERSION: ${IMAGE_TAG:-latest}
      LLM_PROVIDER: ${LLM_PROVIDER:?LLM_PROVIDER must be set}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL must be set}
      OPENWEBUI_BASE_URL: ${OPENWEBUI_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY must be set}
      # Source-of-truth services the assistant pulls live patient context from.
      PATIENT_SERVICE_URL: http://patient-service:8082
      NOTES_SERVICE_URL: http://notes-service:8083
      # Persistent conversation sessions.
      DB_HOST: ai-db
      DB_PORT: 5432
      DB_NAME: ${AI_DB_NAME:?AI_DB_NAME must be set}
      DB_USER: ${AI_DB_USER:?AI_DB_USER must be set}
      DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ai/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - caredesk

  auth-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:?AUTH_DB_NAME must be set}
      POSTGRES_USER: ${AUTH_DB_USER:?AUTH_DB_USER must be set}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  auth-service:
    image: ghcr.io/aet-devops26/team-k8s-commanders/auth-service:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      # Surfaces as the `version` tag on all metrics — the deployed image tag.
      APP_VERSION: ${IMAGE_TAG:-latest}
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB_NAME:?AUTH_DB_NAME must be set}
      DB_USER: ${AUTH_DB_USER:?AUTH_DB_USER must be set}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CAREDESK_BOOTSTRAP_ADMIN_ENABLED: "true"
      CAREDESK_ADMIN_NAME: ${ADMIN_NAME:?ADMIN_NAME must be set}
      CAREDESK_ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      CAREDESK_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      # application.yml ships with ddl-auto: validate. Set AUTH_DDL_AUTO=update for
      # the first deployment so the schema is created, then revert to validate.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${AUTH_DDL_AUTO:-validate}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 360s
    networks:
      - caredesk

  patient-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${PATIENT_DB_NAME:?PATIENT_DB_NAME must be set}
      POSTGRES_USER: ${PATIENT_DB_USER:?PATIENT_DB_USER must be set}
      POSTGRES_PASSWORD: ${PATIENT_DB_PASSWORD:?PATIENT_DB_PASSWORD must be set}
    volumes:
      - patient-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  patient-service:
    image: ghcr.io/aet-devops26/team-k8s-commanders/patient-service:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      patient-db:
        condition: service_healthy
    environment:
      # Surfaces as the `version` tag on all metrics — the deployed image tag.
      APP_VERSION: ${IMAGE_TAG:-latest}
      DB_HOST: patient-db
      DB_PORT: 5432
      DB_NAME: ${PATIENT_DB_NAME:?PATIENT_DB_NAME must be set}
      DB_USER: ${PATIENT_DB_USER:?PATIENT_DB_USER must be set}
      DB_PASSWORD: ${PATIENT_DB_PASSWORD:?PATIENT_DB_PASSWORD must be set}
      # Internal auth-service URL for the cross-service profile lookup.
      AUTH_SERVICE_URL: http://auth-service:8081
      # Internal notification-service URL for booking-confirmation triggers.
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      # application.yml ships with ddl-auto: validate. Set PATIENT_DDL_AUTO=update
      # for the first deployment so the schema is created, then revert.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${PATIENT_DDL_AUTO:-validate}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 360s
    networks:
      - caredesk

  notes-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${NOTES_DB_NAME:?NOTES_DB_NAME must be set}
      POSTGRES_USER: ${NOTES_DB_USER:?NOTES_DB_USER must be set}
      POSTGRES_PASSWORD: ${NOTES_DB_PASSWORD:?NOTES_DB_PASSWORD must be set}
    volumes:
      - notes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  notes-service:
    image: ghcr.io/aet-devops26/team-k8s-commanders/notes-service:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      notes-db:
        condition: service_healthy
    environment:
      # Surfaces as the `version` tag on all metrics — the deployed image tag.
      APP_VERSION: ${IMAGE_TAG:-latest}
      DB_HOST: notes-db
      DB_PORT: 5432
      DB_NAME: ${NOTES_DB_NAME:?NOTES_DB_NAME must be set}
      DB_USER: ${NOTES_DB_USER:?NOTES_DB_USER must be set}
      DB_PASSWORD: ${NOTES_DB_PASSWORD:?NOTES_DB_PASSWORD must be set}
      # application.yml ships with ddl-auto: validate. Set NOTES_DDL_AUTO=update
      # for the first deployment so the schema is created, then revert.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${NOTES_DDL_AUTO:-validate}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  notification-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:?NOTIFICATION_DB_NAME must be set}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:?NOTIFICATION_DB_USER must be set}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD must be set}
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  # Catch-all SMTP server. The web UI is reached through Caddy at /mailpit
  # (behind basic auth); no host ports are published. Point notification-service
  # at a real SMTP provider via SMTP_* to send actual mail instead.
  mailpit:
    image: axllent/mailpit:latest
    restart: always
    environment:
      # Serve the UI under /mailpit so its assets resolve behind the Caddy route.
      MP_WEBROOT: mailpit
    networks:
      - caredesk

  notification-service:
    image: ghcr.io/aet-devops26/team-k8s-commanders/notification-service:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      notification-db:
        condition: service_healthy
    environment:
      # Surfaces as the `version` tag on all metrics — the deployed image tag.
      APP_VERSION: ${IMAGE_TAG:-latest}
      DB_HOST: notification-db
      DB_PORT: 5432
      DB_NAME: ${NOTIFICATION_DB_NAME:?NOTIFICATION_DB_NAME must be set}
      DB_USER: ${NOTIFICATION_DB_USER:?NOTIFICATION_DB_USER must be set}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD must be set}
      # application.yml ships with ddl-auto: validate. Set NOTIFICATION_DDL_AUTO=update
      # for the first deployment so the schema is created, then revert.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${NOTIFICATION_DDL_AUTO:-validate}
      # SMTP target defaults to the Mailpit container; override SMTP_* for a real
      # (authenticated/TLS) provider. Defaults keep Mailpit working with no auth.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-CareDesk <no-reply@caredesk.local>}
      # Reminder scheduler reads upcoming appointments from patient-service.
      PATIENT_SERVICE_URL: http://patient-service:8082
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  api-gateway:
    image: ghcr.io/aet-devops26/team-k8s-commanders/api-gateway:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      auth-service:
        condition: service_healthy
      ai-assistant:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      notes-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment:
      # Surfaces as the `version` tag on all metrics — the deployed image tag.
      APP_VERSION: ${IMAGE_TAG:-latest}
      AUTH_SERVICE_URL: http://auth-service:8081
      AI_ASSISTANT_URL: http://ai-assistant:8000
      PATIENT_SERVICE_URL: http://patient-service:8082
      NOTES_SERVICE_URL: http://notes-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 360s
    networks:
      - caredesk

  prometheus:
    image: prom/prometheus:v3.3.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    restart: always
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - caredesk

  grafana:
    image: grafana/grafana:11.6.16
    # No host port published — reachable only inside the compose network
    # (and externally via the Caddy/TLS proxy).
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Served behind Caddy under /grafana (see infra/caddy/Caddyfile).
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://localhost/grafana}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      PROMETHEUS_URL: http://prometheus:9090
      # Alert delivery (provisioning/alerting/contact-points.yaml). The
      # placeholder keeps Grafana provisioning valid when no webhook is set —
      # alerts then only show in the UI.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-https://alerts-disabled.invalid/discord}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: always
    depends_on:
      - prometheus
    networks:
      - caredesk

volumes:
  auth-db-data:
  patient-db-data:
  notes-db-data:
  notification-db-data:
  ai-db-data:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:

networks:
  caredesk:
    driver: bridge
