services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      web-client:
        condition: service_started
      api-gateway:
        condition: service_healthy
    networks:
      - caredesk

  web-client:
    build:
      # Repo root so the Dockerfile can reach api/openapi.yaml and web-client/
      context: .
      dockerfile: web-client/Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      PUBLIC_API_URL: /api/v1
    networks:
      - caredesk

  ai-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_db
      POSTGRES_USER: caredesk
      POSTGRES_PASSWORD: caredesk
    ports:
      - "5436:5432"
    volumes:
      - ai-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caredesk -d ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  ai-assistant:
    build:
      context: ./services/ai-assistant
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LLM_PROVIDER: openwebui
      LLM_MODEL: llama3.2
      LLM_API_KEY: ollama
      OPENWEBUI_BASE_URL: http://ollama:11434/v1
      # Source-of-truth services the assistant pulls live patient context from.
      PATIENT_SERVICE_URL: http://patient-service:8082
      NOTES_SERVICE_URL: http://notes-service:8083
      # Persistent conversation sessions.
      DB_HOST: ai-db
      DB_PORT: 5432
      DB_NAME: ai_db
      DB_USER: caredesk
      DB_PASSWORD: caredesk
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ai/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      ollama:
        condition: service_healthy
      ai-db:
        condition: service_healthy
    networks:
      - caredesk

  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_MODEL: llama3.2
    entrypoint: >
      sh -c "ollama serve &
             until ollama list > /dev/null 2>&1; do sleep 1; done &&
             ollama pull $$OLLAMA_MODEL &&
             wait"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q $$OLLAMA_MODEL"]
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 30s
    networks:
      - caredesk

  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: caredesk
      POSTGRES_PASSWORD: caredesk
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caredesk -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  auth-service:
    build:
      # Build context is the repo root so the Dockerfile can reach both
      # services/auth-service AND services/springboot/generated (stubs).
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
    # No published port — only reachable inside the compose network via the gateway.
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: caredesk
      DB_PASSWORD: caredesk
      # Dev-only secret — override in production via env or secrets management.
      JWT_SECRET: caredesk-compose-dev-secret-must-be-at-least-32-chars
      SPRING_PROFILES_ACTIVE: dev
      # application.yml ships with ddl-auto: validate for production safety.
      # Compose dev profile overrides to `update` so schema is auto-created
      # against a fresh Postgres. Production should use proper migrations.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  patient-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: caredesk
      POSTGRES_PASSWORD: caredesk
    ports:
      - "5433:5432"
    volumes:
      - patient-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caredesk -d patient_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  patient-service:
    build:
      # Build context is the repo root so the Dockerfile can reach both
      # services/patient-service AND services/springboot/generated (stubs).
      context: .
      dockerfile: services/patient-service/Dockerfile
    restart: unless-stopped
    depends_on:
      patient-db:
        condition: service_healthy
    # No published port — only reachable inside the compose network via the gateway.
    environment:
      DB_HOST: patient-db
      DB_PORT: 5432
      DB_NAME: patient_db
      DB_USER: caredesk
      DB_PASSWORD: caredesk
      # Internal auth-service URL for the cross-service profile lookup.
      AUTH_SERVICE_URL: http://auth-service:8081
      SPRING_PROFILES_ACTIVE: dev
      # application.yml ships with ddl-auto: validate. Compose dev profile
      # overrides to update so the schema is auto-created against a fresh DB.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  notes-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: notes_db
      POSTGRES_USER: caredesk
      POSTGRES_PASSWORD: caredesk
    ports:
      - "5434:5432"
    volumes:
      - notes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caredesk -d notes_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  notes-service:
    build:
      # Build context is the repo root so the Dockerfile can reach both
      # services/notes-service AND services/springboot/generated (stubs).
      context: .
      dockerfile: services/notes-service/Dockerfile
    restart: unless-stopped
    depends_on:
      notes-db:
        condition: service_healthy
    # No published port — only reachable inside the compose network via the gateway.
    environment:
      DB_HOST: notes-db
      DB_PORT: 5432
      DB_NAME: notes_db
      DB_USER: caredesk
      DB_PASSWORD: caredesk
      # application.yml ships with ddl-auto: validate. Compose dev profile
      # overrides to update so the schema is auto-created against a fresh DB.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  notification-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: caredesk
      POSTGRES_PASSWORD: caredesk
    ports:
      - "5435:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caredesk -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  notification-service:
    build:
      # Build context is the repo root so the Dockerfile can reach both
      # services/notification-service AND services/springboot/generated (stubs).
      context: .
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    depends_on:
      notification-db:
        condition: service_healthy
    # No published port — only reachable inside the compose network via the gateway.
    environment:
      DB_HOST: notification-db
      DB_PORT: 5432
      DB_NAME: notification_db
      DB_USER: caredesk
      DB_PASSWORD: caredesk
      # application.yml ships with ddl-auto: validate. Compose dev profile
      # overrides to update so the schema is auto-created against a fresh DB.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      notes-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      AI_ASSISTANT_URL: http://ai-assistant:8000
      PATIENT_SERVICE_URL: http://patient-service:8082
      NOTES_SERVICE_URL: http://notes-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      # Must match auth-service's JWT_SECRET so issued tokens verify.
      JWT_SECRET: caredesk-compose-dev-secret-must-be-at-least-32-chars
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caredesk

  prometheus:
    image: prom/prometheus:v3.3.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - caredesk

networks:
  caredesk:
    driver: bridge

volumes:
  auth-db-data:
  patient-db-data:
  notes-db-data:
  notification-db-data:
  ai-db-data:
  ollama_data:
  prometheus-data:
