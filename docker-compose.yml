services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      web-client:
        condition: service_started
      ai-assistant:
        condition: service_healthy
    networks:
      - caredesk

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://host.docker.internal:80
    restart: unless-stopped
    environment:
      PUBLIC_API_URL: http://host.docker.internal:80
    networks:
      - caredesk

  ai-assistant:
    build:
      context: ./services/ai-assistant
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LLM_PROVIDER: openwebui
      LLM_MODEL: llama3.2
      LLM_API_KEY: ollama
      OPENWEBUI_BASE_URL: http://ollama:11434/v1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ai/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - caredesk

  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_MODEL: llama3.2
    entrypoint: >
      sh -c "ollama serve &
             until ollama list > /dev/null 2>&1; do sleep 1; done &&
             ollama pull $$OLLAMA_MODEL &&
             wait"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q $$OLLAMA_MODEL"]
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 30s
    networks:
      - caredesk

networks:
  caredesk:
    driver: bridge

volumes:
  ollama_data:
