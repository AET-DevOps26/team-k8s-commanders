services:
  ai-assistant:
    build:
      context: ./services/ai-assistant
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - ./services/ai-assistant/.env

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://host.docker.internal:8080
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      PUBLIC_API_URL: http://host.docker.internal:8080
