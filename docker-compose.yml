services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      web-client:
        condition: service_started
      ai-assistant:
        condition: service_healthy
    networks:
      - caredesk

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:80
    restart: unless-stopped
    environment:
      PUBLIC_API_URL: http://localhost:80
    networks:
      - caredesk

  ai-assistant:
    build:
      context: ./services/ai-assistant
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./services/ai-assistant/.env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ai/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - caredesk

networks:
  caredesk:
    driver: bridge
