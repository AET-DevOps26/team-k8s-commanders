{{- $promURL := printf "http://%s-prometheus:9090" (include "caredesk-monitoring.fullname" .) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "caredesk-monitoring.fullname" . }}-grafana-provisioning
  labels:
    {{- include "caredesk-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: {{ $promURL }}
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 15s
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: caredesk
        orgId: 1
        folder: CareDesk
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
  # Grafana-managed alert rules, loaded verbatim from the chart's `alerting/` directory
  # (a symlink to infra/grafana/provisioning/alerting — the single source of truth shared
  # with the docker-compose stack). .Files.Get returns raw bytes without template processing,
  # so Grafana's double-brace label tokens in the rules pass through untouched.
  alerting.yaml: |
{{ .Files.Get "alerting/alerts.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "caredesk-monitoring.fullname" . }}-grafana-dashboards
  labels:
    {{- include "caredesk-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  # Dashboards are loaded verbatim from the chart's `dashboards/` directory, which is a
  # symlink to infra/grafana/dashboards — the single source of truth shared with the
  # docker-compose stack. Glob picks up every *.json automatically, so adding a new
  # dashboard file needs no template changes. .Files.Get returns raw bytes without
  # template processing, so Grafana's double-brace legend tokens in the JSON pass through as-is.
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
