{{- $fullName := include "caredesk-monitoring.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-grafana
  labels:
    {{- include "caredesk-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "caredesk-monitoring.selectorLabels" (dict "root" . "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "caredesk-monitoring.selectorLabels" (dict "root" . "component" "grafana") | nindent 8 }}
      annotations:
        # Grafana reads alerting/datasource provisioning only at startup; a changed
        # pod-spec hash forces a rollout when dashboards or alert rules change.
        checksum/config: {{ include (print $.Template.BasePath "/grafana-configmap.yaml") . | sha256sum }}
        # Roll the pod when the admin password or Discord webhook changes — a
        # secretKeyRef alone would not restart it on a rotated Secret.
        checksum/secret: {{ include (print $.Template.BasePath "/grafana-secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.adminUser | quote }}
            # From the grafana Secret rather than a plaintext manifest value, so the
            # password never lands in the rendered Deployment/release.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-grafana
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # Interpolated into provisioning/alerting/contact-points.yaml. Sourced
            # from the grafana Secret (a webhook URL is a credential); the Secret
            # supplies the placeholder default when none is configured.
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-grafana
                  key: DISCORD_WEBHOOK_URL
            {{- if .Values.grafana.smtp.enabled }}
            # SMTP relay for the caredesk-mailpit-email alert contact point —
            # delivers alert emails to Mailpit (host/from are plain config, not
            # secrets). skipVerify because Mailpit is plaintext (no TLS cert).
            - name: GF_SMTP_ENABLED
              value: "true"
            - name: GF_SMTP_HOST
              value: {{ .Values.grafana.smtp.host | quote }}
            - name: GF_SMTP_FROM_ADDRESS
              value: {{ .Values.grafana.smtp.fromAddress | quote }}
            - name: GF_SMTP_SKIP_VERIFY
              value: {{ .Values.grafana.smtp.skipVerify | quote }}
            {{- end }}
            {{- if .Values.ingress.enabled }}
            # Grafana owns the root path of its dedicated host — no sub-path
            # serving needed (unlike the compose stack, which sits behind
            # Caddy under /grafana).
            - name: GF_SERVER_ROOT_URL
              value: {{ printf "%s://%s" (ternary "https" "http" .Values.ingress.tls.enabled) (include "caredesk-monitoring.ingressHost" .) | quote }}
            {{- end }}
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: provisioning
          configMap:
            name: {{ $fullName }}-grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources/datasources.yaml
              - key: dashboards.yaml
                path: dashboards/dashboards.yaml
              - key: alerting.yaml
                path: alerting/alerts.yaml
              - key: contact-points.yaml
                path: alerting/contact-points.yaml
        - name: dashboards
          configMap:
            name: {{ $fullName }}-grafana-dashboards
        # All state Grafana needs (datasources, dashboards, alert rules) is
        # provisioned from the ConfigMaps above, so local storage is throwaway.
        - name: data
          emptyDir: {}
