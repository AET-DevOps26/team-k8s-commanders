{{- /*
Grafana secrets — the admin password and the Discord alert webhook. Kept in a
Secret (consumed via secretKeyRef from the Deployment) rather than as plaintext
env `value:`s on the Deployment spec, so neither lands in `kubectl get deploy
-o yaml` or the rendered release manifest. Matches the caredesk chart convention.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caredesk-monitoring.fullname" . }}-grafana
  labels:
    {{- include "caredesk-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
type: Opaque
stringData:
  # Required — no chart default. Supply at install time (CI injects the
  # GRAFANA_ADMIN_PASSWORD secret) so Grafana never ships with a known password.
  GF_SECURITY_ADMIN_PASSWORD: {{ required "grafana.adminPassword is required — pass --set grafana.adminPassword=<secret> (CI injects the GRAFANA_ADMIN_PASSWORD secret)" .Values.grafana.adminPassword | quote }}
  # Interpolated into provisioning/alerting/contact-points.yaml. The placeholder
  # keeps provisioning valid (empty would abort startup) while making failed
  # deliveries obvious in the logs.
  DISCORD_WEBHOOK_URL: {{ .Values.grafana.discordWebhookUrl | default "https://alerts-disabled.invalid/discord" | quote }}
