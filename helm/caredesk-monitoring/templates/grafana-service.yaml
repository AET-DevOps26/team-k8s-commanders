apiVersion: v1
kind: Service
metadata:
  name: {{ include "caredesk-monitoring.fullname" . }}-grafana
  labels:
    {{- include "caredesk-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    {{- include "caredesk-monitoring.selectorLabels" (dict "root" . "component" "grafana") | nindent 4 }}
