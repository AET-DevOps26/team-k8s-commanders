{{- if .Values.ingress.enabled -}}
{{- $fullName := include "caredesk-monitoring.fullname" . -}}
{{- $host := include "caredesk-monitoring.ingressHost" . -}}
{{- /*
Grafana gets its own host with the root path. An Ingress can only route to
Services in its own namespace, so this cannot share the caredesk chart's
Ingress; a dedicated host also spares Grafana the sub-path configuration.
Prometheus is deliberately NOT exposed — its API has no authentication.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "caredesk-monitoring.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-grafana
                port:
                  number: 3000
{{- end }}
