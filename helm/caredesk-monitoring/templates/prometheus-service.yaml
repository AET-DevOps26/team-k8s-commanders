apiVersion: v1
kind: Service
metadata:
  name: {{ include "caredesk-monitoring.fullname" . }}-prometheus
  labels:
    {{- include "caredesk-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
  selector:
    {{- include "caredesk-monitoring.selectorLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
