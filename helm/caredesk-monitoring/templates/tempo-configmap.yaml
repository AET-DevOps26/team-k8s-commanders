apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "caredesk-monitoring.fullname" . }}-tempo
  labels:
    {{- include "caredesk-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
data:
  # Loaded verbatim from the chart's `tempo/` directory, a symlink to
  # infra/tempo — the single source of truth shared with the docker-compose
  # stack. No templating needed: the config has no per-environment values.
  tempo.yaml: |
{{ .Files.Get "tempo/tempo.yaml" | indent 4 }}
