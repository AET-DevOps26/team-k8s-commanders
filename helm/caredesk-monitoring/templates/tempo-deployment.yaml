apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "caredesk-monitoring.fullname" . }}-tempo
  labels:
    {{- include "caredesk-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  replicas: 1
  strategy:
    # Recreate: the trace-storage PVC is ReadWriteOnce, so the old pod must
    # release it before the new one can mount it (same reasoning as Prometheus).
    type: Recreate
  selector:
    matchLabels:
      {{- include "caredesk-monitoring.selectorLabels" (dict "root" . "component" "tempo") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "caredesk-monitoring.selectorLabels" (dict "root" . "component" "tempo") | nindent 8 }}
      annotations:
        # Tempo has no config auto-reload; a changed pod-spec hash forces a
        # rollout when tempo.yaml changes.
        checksum/config: {{ include (print $.Template.BasePath "/tempo-configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        # The image's built-in tempo user (ownership of /var/tempo baked into
        # the image since Tempo 2.5) — must match, or the container can't
        # write blocks/WAL to the mounted PVC.
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: tempo
          image: {{ .Values.tempo.image }}
          args:
            - '-config.file=/etc/tempo/tempo.yaml'
          ports:
            - name: http
              containerPort: 3200
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /var/tempo
          resources:
            {{- toYaml .Values.tempo.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ include "caredesk-monitoring.fullname" . }}-tempo
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "caredesk-monitoring.fullname" . }}-tempo
