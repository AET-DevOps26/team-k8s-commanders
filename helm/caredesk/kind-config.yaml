# kind cluster config for local CareDesk deployment.
# Maps node ports 80/443 to host 18080/18443 so the ingress is reachable at
# http://caredesk.localtest.me:18080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: caredesk
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 18080
        protocol: TCP
      - containerPort: 443
        hostPort: 18443
        protocol: TCP
