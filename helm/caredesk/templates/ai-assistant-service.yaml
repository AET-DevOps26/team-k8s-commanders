{{- if .Values.ai.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "caredesk.fullname" . }}-ai
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ai.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "caredesk.selectorLabels" (dict "root" . "component" "ai") | nindent 4 }}
{{- end }}
