{{- if .Values.auth.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "caredesk.fullname" . }}-auth
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  replicas: {{ .Values.auth.replicaCount }}
  selector:
    matchLabels:
      {{- include "caredesk.selectorLabels" (dict "root" . "component" "auth") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "caredesk.selectorLabels" (dict "root" . "component" "auth") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret-app.yaml") . | sha256sum }}
    spec:
      {{- include "caredesk.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        # Block startup until Postgres accepts TCP connections — avoids
        # CrashLoopBackOff while the DB pod is still pulling/initialising.
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "caredesk.postgresHost" . }} 5432; do
                echo "waiting for postgres..."; sleep 2;
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
      {{- end }}
      containers:
        - name: auth-service
          image: {{ include "caredesk.image" (dict "root" $ "image" .Values.auth.image) | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.auth.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "caredesk.fullname" . }}-config
          env:
            - name: SERVER_PORT
              value: {{ .Values.auth.service.port | quote }}
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: {{ .Values.auth.env.ddlAuto | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "caredesk.fullname" . }}-app
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}
{{- end }}
