{{- if .Values.auth.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "caredesk.fullname" . }}-auth
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  replicas: {{ .Values.auth.replicaCount }}
  strategy:
    type: {{ .Values.deploymentStrategy.type }}
  selector:
    matchLabels:
      {{- include "caredesk.selectorLabels" (dict "root" . "component" "auth") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "caredesk.selectorLabels" (dict "root" . "component" "auth") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret-app.yaml") . | sha256sum }}
    spec:
      {{- include "caredesk.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: auth-service
          image: {{ include "caredesk.image" (dict "root" $ "image" .Values.auth.image) | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.auth.service.port }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.auth.service.port | quote }}
            {{- include "caredesk.appVersionEnv" (dict "root" $ "image" .Values.auth.image) | nindent 12 }}
            - name: JWT_EXPIRATION_MS
              value: {{ .Values.backend.jwtExpirationMs | quote }}
            - name: CAREDESK_BOOTSTRAP_ADMIN_ENABLED
              value: {{ .Values.auth.bootstrapAdmin.enabled | quote }}
            {{- if .Values.auth.bootstrapAdmin.enabled }}
            - name: CAREDESK_ADMIN_NAME
              value: {{ required "auth.bootstrapAdmin.name is required when admin bootstrap is enabled" .Values.auth.bootstrapAdmin.name | quote }}
            - name: CAREDESK_ADMIN_EMAIL
              value: {{ required "auth.bootstrapAdmin.email is required when admin bootstrap is enabled" .Values.auth.bootstrapAdmin.email | quote }}
            - name: CAREDESK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "caredesk.fullname" . }}-app
                  key: CAREDESK_ADMIN_PASSWORD
            {{- end }}
            {{- include "caredesk.dbEnv" (dict "root" $ "host" .Values.auth.dbHost "name" .Values.auth.dbName) | nindent 12 }}
            {{- include "caredesk.seedEnv" $ | nindent 12 }}
            {{- include "caredesk.jwtEnv" . | nindent 12 }}
          # Generous startup window for Spring Boot + JPA schema generation.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}
{{- end }}
