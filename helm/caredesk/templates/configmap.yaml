apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "caredesk.fullname" . }}-config
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
data:
  # Shared
  PUBLIC_API_URL: {{ include "caredesk.publicApiUrl" . | quote }}
  AI_BASE_URL: {{ printf "http://%s-ai:%d" (include "caredesk.fullname" .) (int .Values.ai.service.port) | quote }}

  # ai-assistant
  LLM_PROVIDER: {{ .Values.ai.env.llmProvider | quote }}
  LLM_MODEL: {{ .Values.ai.env.llmModel | quote }}
  OPENWEBUI_BASE_URL: {{ .Values.ai.env.openwebuiBaseUrl | quote }}

  {{- if .Values.auth.enabled }}
  # auth-service
  JWT_EXPIRATION_MS: {{ .Values.auth.env.jwtExpirationMs | quote }}
  DB_HOST: {{ include "caredesk.postgresHost" . | quote }}
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgresql.auth.database | quote }}
  DB_USER: {{ .Values.postgresql.auth.username | quote }}
  {{- end }}
