{{- if .Values.ingress.enabled -}}
{{- $fullName := include "caredesk.fullname" . -}}
{{- $host := include "caredesk.ingressHost" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- if .Values.gateway.enabled }}
          # The /api prefix (covering all /api/v1/** routes) is forwarded
          # unchanged to the gateway — no nginx rewrite. The gateway owns the
          # /api/v1 routes and strips that prefix itself (StripPrefix=2) before
          # forwarding to the downstream services.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-gateway
                port:
                  number: {{ .Values.gateway.service.port }}
          {{- end }}
          {{- if .Values.web.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-web
                port:
                  number: {{ .Values.web.service.port }}
          {{- end }}
{{- end }}
