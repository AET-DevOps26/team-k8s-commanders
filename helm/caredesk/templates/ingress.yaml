{{- if .Values.ingress.enabled -}}
{{- $fullName := include "caredesk.fullname" . -}}
{{- $host := include "caredesk.ingressHost" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- if .Values.auth.enabled }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-auth
                port:
                  number: {{ .Values.auth.service.port }}
          {{- end }}
          {{- if .Values.ai.enabled }}
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-ai
                port:
                  number: {{ .Values.ai.service.port }}
          {{- end }}
          {{- if .Values.web.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-web
                port:
                  number: {{ .Values.web.service.port }}
          {{- end }}
{{- end }}
