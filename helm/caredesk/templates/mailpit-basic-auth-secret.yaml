{{- if and .Values.mailpit.enabled .Values.mailpit.ingress.enabled .Values.ingress.enabled -}}
{{- /*
htpasswd-format credentials consumed by the mailpit Ingress's nginx basic-auth
annotations (auth-secret). The `auth` key holds `user:hash`; the hash is bcrypt
($2y$), which nginx ingress supports. Same default credentials as the Azure
deploy — override mailpit.ingress.basicAuth for a non-demo deployment.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caredesk.fullname" . }}-mailpit-basic-auth
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
type: Opaque
stringData:
  auth: {{ printf "%s:%s" (required "mailpit.ingress.basicAuth.user is required" .Values.mailpit.ingress.basicAuth.user) (required "mailpit.ingress.basicAuth.hash is required" .Values.mailpit.ingress.basicAuth.hash) | quote }}
{{- end }}
