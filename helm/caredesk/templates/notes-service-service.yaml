{{- if .Values.notes.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "caredesk.fullname" . }}-notes
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: notes
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.notes.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "caredesk.selectorLabels" (dict "root" . "component" "notes") | nindent 4 }}
{{- end }}
