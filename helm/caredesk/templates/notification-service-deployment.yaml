{{- if .Values.notification.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "caredesk.fullname" . }}-notification
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification
spec:
  replicas: {{ .Values.notification.replicaCount }}
  strategy:
    type: {{ .Values.deploymentStrategy.type }}
  selector:
    matchLabels:
      {{- include "caredesk.selectorLabels" (dict "root" . "component" "notification") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "caredesk.selectorLabels" (dict "root" . "component" "notification") | nindent 8 }}
    spec:
      {{- include "caredesk.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: notification-service
          image: {{ include "caredesk.image" (dict "root" $ "image" .Values.notification.image) | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.notification.service.port }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.notification.service.port | quote }}
            {{- include "caredesk.dbEnv" (dict "root" $ "host" .Values.notification.dbHost "name" .Values.notification.dbName) | nindent 12 }}
            # SMTP target — defaults to the in-cluster Mailpit service. Provide
            # username/password/auth/startTls for an authenticated/TLS provider.
            - name: SMTP_HOST
              value: {{ .Values.notification.smtp.host | default (printf "%s-mailpit" (include "caredesk.fullname" .)) | quote }}
            - name: SMTP_PORT
              value: {{ .Values.notification.smtp.port | default .Values.mailpit.smtpPort | quote }}
            - name: SMTP_USERNAME
              value: {{ .Values.notification.smtp.username | quote }}
            # From the app Secret rather than a plaintext manifest value, so a real
            # SMTP password never lands in the rendered Deployment/release values.
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "caredesk.fullname" . }}-app
                  key: SMTP_PASSWORD
            - name: SMTP_AUTH
              value: {{ .Values.notification.smtp.auth | quote }}
            - name: SMTP_STARTTLS
              value: {{ .Values.notification.smtp.startTls | quote }}
            - name: MAIL_FROM
              value: {{ .Values.notification.mailFrom | quote }}
            # Reminder scheduler reads upcoming appointments from patient-service.
            - name: PATIENT_SERVICE_URL
              value: {{ printf "http://%s-patient:%d" (include "caredesk.fullname" .) (int .Values.patient.service.port) | quote }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.notification.resources | nindent 12 }}
{{- end }}
