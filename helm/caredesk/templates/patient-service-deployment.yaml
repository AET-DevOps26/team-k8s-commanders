{{- if .Values.patient.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "caredesk.fullname" . }}-patient
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: patient
spec:
  replicas: {{ .Values.patient.replicaCount }}
  strategy:
    type: {{ .Values.deploymentStrategy.type }}
  selector:
    matchLabels:
      {{- include "caredesk.selectorLabels" (dict "root" . "component" "patient") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "caredesk.selectorLabels" (dict "root" . "component" "patient") | nindent 8 }}
    spec:
      {{- include "caredesk.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: patient-service
          image: {{ include "caredesk.image" (dict "root" $ "image" .Values.patient.image) | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.patient.service.port }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.patient.service.port | quote }}
            {{- include "caredesk.appVersionEnv" (dict "root" $ "image" .Values.patient.image) | nindent 12 }}
            {{- include "caredesk.tracingEnv" $ | nindent 12 }}
            {{- include "caredesk.dbEnv" (dict "root" $ "host" .Values.patient.dbHost "name" .Values.patient.dbName) | nindent 12 }}
            {{- include "caredesk.seedEnv" $ | nindent 12 }}
            # Resolve the patient's contact email from the authoritative profile.
            - name: AUTH_SERVICE_URL
              value: {{ printf "http://%s-auth:%d" (include "caredesk.fullname" .) (int .Values.auth.service.port) | quote }}
            # Fire booking-confirmation triggers to notification-service.
            - name: NOTIFICATION_SERVICE_URL
              value: {{ printf "http://%s-notification:%d" (include "caredesk.fullname" .) (int .Values.notification.service.port) | quote }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.patient.resources | nindent 12 }}
{{- end }}
