{{- if .Values.patient.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "caredesk.fullname" . }}-patient
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: patient
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.patient.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "caredesk.selectorLabels" (dict "root" . "component" "patient") | nindent 4 }}
{{- end }}
