{{- /*
Application secrets. JWT_SECRET is always present (a dev default in values
keeps the stack deployable with one command); LLM_API_KEY is included only when
a key is supplied.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caredesk.fullname" . }}-app
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.backend.jwtSecret | quote }}
  {{- if .Values.auth.bootstrapAdmin.enabled }}
  CAREDESK_ADMIN_PASSWORD: {{ required "auth.bootstrapAdmin.password is required when admin bootstrap is enabled" .Values.auth.bootstrapAdmin.password | quote }}
  {{- end }}
  {{- if .Values.ai.secrets.llmApiKey }}
  LLM_API_KEY: {{ .Values.ai.secrets.llmApiKey | quote }}
  {{- end }}
