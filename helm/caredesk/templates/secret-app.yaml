{{- /*
Application secrets. JWT_SECRET is required (no chart default — it must be
supplied at install time, e.g. --set backend.jwtSecret or CI's JWT_SECRET
secret); LLM_API_KEY is included only when a key is supplied.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caredesk.fullname" . }}-app
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "backend.jwtSecret is required — pass --set backend.jwtSecret=<secret> (CI injects the JWT_SECRET secret)" .Values.backend.jwtSecret | quote }}
  {{- if .Values.auth.bootstrapAdmin.enabled }}
  CAREDESK_ADMIN_PASSWORD: {{ required "auth.bootstrapAdmin.password is required when admin bootstrap is enabled" .Values.auth.bootstrapAdmin.password | quote }}
  {{- end }}
  {{- if .Values.notification.enabled }}
  # Empty for Mailpit (no auth); set notification.smtp.password (ideally via
  # --set) for a real authenticated SMTP provider.
  SMTP_PASSWORD: {{ .Values.notification.smtp.password | quote }}
  {{- end }}
  {{- if .Values.ai.secrets.llmApiKey }}
  LLM_API_KEY: {{ .Values.ai.secrets.llmApiKey | quote }}
  {{- end }}
