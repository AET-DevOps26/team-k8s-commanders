{{- $needAi := and .Values.ai.enabled .Values.ai.secrets.llmApiKey -}}
{{- $needAuth := and .Values.auth.enabled .Values.auth.secrets.jwtSecret -}}
{{- if or $needAi $needAuth -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caredesk.fullname" . }}-app
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needAi }}
  LLM_API_KEY: {{ .Values.ai.secrets.llmApiKey | quote }}
  {{- end }}
  {{- if $needAuth }}
  JWT_SECRET: {{ .Values.auth.secrets.jwtSecret | quote }}
  {{- end }}
{{- end }}
