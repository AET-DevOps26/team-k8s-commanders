apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caredesk.fullname" . }}-db
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "postgres.password is required — pass --set postgres.password=<secret> (CI injects the POSTGRES_PASSWORD secret)" .Values.postgres.password | quote }}
