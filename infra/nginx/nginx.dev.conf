server {
    listen 80;
    server_name _;

    # All API traffic goes through the gateway, which validates JWTs and routes
    # to auth-service / ai-assistant / future backend services.
    location /api/v1/ {
        proxy_pass         http://api-gateway:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Web client — catch-all
    location / {
        proxy_pass         http://web-client:3000;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
