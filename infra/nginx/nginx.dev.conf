server {
    listen 80;
    server_name _;

    # AI assistant — /api/v1/ai/* → ai-assistant:8000/ai/*
    location /api/v1/ai/ {
        proxy_pass         http://ai-assistant:8000/ai/;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Add further services here, e.g.:
    # location /api/v1/auth/    { proxy_pass http://auth-service:8080/; ... }

    # Web client — catch-all
    location / {
        proxy_pass         http://web-client:3000;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
