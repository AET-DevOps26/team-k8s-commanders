server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # AI assistant — /api/v1/ai/* → ai-assistant:8000/ai/*
    location /api/v1/ai/ {
        proxy_pass         http://ai-assistant:8000/ai/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # Add further services here, e.g.:
    # location /api/v1/auth/    { proxy_pass http://auth-service:8080/; ... }
    # location /api/v1/users/   { proxy_pass http://user-service:8081/; ... }

    # Web client — must be last (catch-all)
    location / {
        proxy_pass         http://web-client:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
