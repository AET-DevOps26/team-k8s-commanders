server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # CORS for browser clients served from a different origin than the API
          # (e.g. the web-client when PUBLIC_API_URL points straight at the gateway,
          # or split hosts behind a k8s ingress). Without this, the browser's
          # preflight (OPTIONS) for PUT/DELETE/POST fails and the request is blocked.
          # Auth uses a Bearer header (not cookies), so credentials are not required.
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "${CORS_ALLOWED_ORIGINS:*}"
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: "*"
                exposedHeaders: [X-Correlation-ID]
                allowCredentials: false
                maxAge: 3600
          # The /api/v1 prefix is owned by the gateway (per the OpenAPI spec's server base path).
          # StripPrefix=2 removes /api and /v1 before forwarding to downstream services,
          # so the auth-service receives /auth/register, not /api/v1/auth/register.
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
              filters:
                - StripPrefix=2

            - id: ai-assistant
              uri: ${AI_ASSISTANT_URL:http://localhost:8000}
              predicates:
                - Path=/api/v1/ai/**
              filters:
                - StripPrefix=2

            # Must come before patient-service: the clinical note sub-path is more
            # specific than /appointments/** and is owned by the notes-service.
            - id: notes-service
              uri: ${NOTES_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/appointments/*/note
              filters:
                - StripPrefix=2

            # Must come before patient-service: the notifications sub-path is more
            # specific than /appointments/** and is owned by the notification-service.
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/appointments/*/notifications
              filters:
                - StripPrefix=2

            - id: patient-service
              uri: ${PATIENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/patients/**,/api/v1/doctors/**,/api/v1/appointments/**,/api/v1/clinics/**
              filters:
                - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    distribution:
      # Emit http_server_requests_seconds_bucket so Grafana's p95 latency alert
      # (histogram_quantile in infra/grafana/provisioning/alerting/alerts.yaml)
      # has buckets to read. Without this Micrometer only exports _count/_sum and
      # the p95 rule sits at NoData forever.
      percentiles-histogram:
        http.server.requests: true
    tags:
      # Deployed version (image tag), injected as APP_VERSION by Helm/compose.
      # Tags every metric so changes can be correlated with releases in Grafana.
      version: ${APP_VERSION:unknown}
  tracing:
    sampling:
      # Share of requests traced. 1.0 (every request) is fine at this traffic
      # volume; drop it before this ever sees production-scale load.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Tempo's OTLP/HTTP receiver, injected by Helm/compose. Unreachable when
      # Tempo isn't deployed — the exporter just logs failed exports, same
      # tolerance as a scrape target being down.
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Shared secret used to verify JWTs issued by auth-service.
# Must match auth-service's JWT_SECRET.
jwt:
  secret: ${JWT_SECRET}

# Shared backend log format. Correlation is included explicitly in gateway request logs;
# servlet services and the AI assistant use the same field through request context.
logging:
  level:
    root: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} correlationId=%X{correlationId:-none} logger=%logger{36} message=%msg%n%wEx"
