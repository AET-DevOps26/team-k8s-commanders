<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CareDesk API — Swagger UI</title>
    <!-- Assets resolved from the swagger-ui webjar by the gateway (see OpenApiDocsConfig). -->
    <link rel="stylesheet" href="/api/v1/webjars/swagger-ui/swagger-ui.css" />
    <link rel="icon" type="image/png" href="/api/v1/webjars/swagger-ui/favicon-32x32.png" sizes="32x32" />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="/api/v1/webjars/swagger-ui/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="/api/v1/webjars/swagger-ui/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "/api/v1/openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
      });
    </script>
  </body>
</html>
