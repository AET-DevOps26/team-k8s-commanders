server:
  port: 8081

# Gateway owns the /api/v1 prefix — service exposes /auth/** directly.
openapi:
  careDesk:
    base-path: ""

spring:
  application:
    name: auth-service
  # Render errors as RFC 9457 application/problem+json, matching the API contract.
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER:caredesk}
    password: ${DB_PASSWORD:caredesk}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000  # 24 hours

caredesk:
  bootstrap:
    admin:
      enabled: ${CAREDESK_BOOTSTRAP_ADMIN_ENABLED:false}
      name: ${CAREDESK_ADMIN_NAME:}
      email: ${CAREDESK_ADMIN_EMAIL:}
      password: ${CAREDESK_ADMIN_PASSWORD:}
  seed:
    test-patients: ${CAREDESK_SEED_TEST_PATIENTS:false}
