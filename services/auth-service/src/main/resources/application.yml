server:
  port: 8081

# Gateway owns the /api/v1 prefix — service exposes /auth/** directly.
openapi:
  careDesk:
    base-path: ""

spring:
  application:
    name: auth-service
  jackson:
    # Omit null properties from JSON responses. The OpenAPI contract models
    # optional fields by absence (not nullability), so a UserProfile with no
    # clinicId must serialize as an omitted key, not "clinicId": null. Emitting
    # an explicit null breaks strict generated clients — the ai-assistant's
    # Python client calls UUID(clinicId) on any present key and raises on
    # UUID(None), which surfaced as a 502 on patient-scoped AI queries.
    default-property-inclusion: non_null
  # Render errors as RFC 9457 application/problem+json, matching the API contract.
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER:caredesk}
    password: ${DB_PASSWORD:caredesk}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    distribution:
      # Emit http_server_requests_seconds_bucket so Grafana's p95 latency alert
      # (histogram_quantile in infra/grafana/provisioning/alerting/alerts.yaml)
      # has buckets to read. Without this Micrometer only exports _count/_sum and
      # the p95 rule sits at NoData forever.
      percentiles-histogram:
        http.server.requests: true
    tags:
      # Deployed version (image tag), injected as APP_VERSION by Helm/compose.
      # Tags every metric so changes can be correlated with releases in Grafana.
      version: ${APP_VERSION:unknown}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000  # 24 hours

caredesk:
  bootstrap:
    admin:
      enabled: ${CAREDESK_BOOTSTRAP_ADMIN_ENABLED:false}
      name: ${CAREDESK_ADMIN_NAME:}
      email: ${CAREDESK_ADMIN_EMAIL:}
      password: ${CAREDESK_ADMIN_PASSWORD:}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} correlationId=%X{correlationId:-none} logger=%logger{36} message=%msg%n%wEx"
