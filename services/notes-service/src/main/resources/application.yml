server:
  port: 8083

# Gateway owns the /api/v1 prefix — this service exposes /appointments/{id}/note
# directly.
openapi:
  careDesk:
    base-path: ""

spring:
  application:
    name: notes-service
  jackson:
    # Omit null properties from JSON responses. The OpenAPI contract models
    # optional fields by absence (not nullability), so an optional UUID must
    # serialize as an omitted key, not an explicit null. Emitting null breaks
    # strict generated clients — the ai-assistant's Python client calls
    # UUID(value) on any present key and raises on UUID(None), which surfaced as
    # a 502 on patient-scoped AI queries.
    default-property-inclusion: non_null
  # Render errors as RFC 9457 application/problem+json, matching the API contract.
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notes_db}
    username: ${DB_USER:caredesk}
    password: ${DB_PASSWORD:caredesk}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # `validate` is the production-safe default. It will fail to boot if the
      # notes_db schema is missing, which is intentional in production.
      # Dev compose and prod compose both override this with
      # SPRING_JPA_HIBERNATE_DDL_AUTO=update so the schema is created on first
      # boot against a fresh Postgres. See docker-compose.yml.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Actuator health and prometheus are permitted in SecurityConfig for Docker healthcheck and scraping.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    distribution:
      # Emit http_server_requests_seconds_bucket so Grafana's p95 latency alert
      # (histogram_quantile in infra/grafana/provisioning/alerting/alerts.yaml)
      # has buckets to read. Without this Micrometer only exports _count/_sum and
      # the p95 rule sits at NoData forever.
      percentiles-histogram:
        http.server.requests: true
    tags:
      # Deployed version (image tag), injected as APP_VERSION by Helm/compose.
      # Tags every metric so changes can be correlated with releases in Grafana.
      version: ${APP_VERSION:unknown}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} correlationId=%X{correlationId:-none} logger=%logger{36} message=%msg%n%wEx"
