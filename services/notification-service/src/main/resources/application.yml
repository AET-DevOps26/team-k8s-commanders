server:
  port: 8084

# Gateway owns the /api/v1 prefix — this service exposes /notifications and
# /appointments/{id}/notifications directly.
openapi:
  careDesk:
    base-path: ""

# Internal patient-service URL for the reminder scheduler's upcoming-appointments feed.
patient-service:
  url: ${PATIENT_SERVICE_URL:http://localhost:8082}

# Appointment reminder scheduler. Disable in tests with reminder.enabled=false.
notification:
  mail:
    # From address on outgoing mail. Override per environment.
    from: ${MAIL_FROM:CareDesk <no-reply@caredesk.local>}
  reminder:
    enabled: ${REMINDER_ENABLED:true}
    # How far ahead to look for appointments needing a reminder.
    window-hours: ${REMINDER_WINDOW_HOURS:24}
    # How often the scan runs, and how long to wait after startup before the first run.
    scan-interval-ms: ${REMINDER_SCAN_INTERVAL_MS:900000}
    initial-delay-ms: ${REMINDER_INITIAL_DELAY_MS:60000}

spring:
  application:
    name: notification-service
  jackson:
    # Omit null properties from JSON responses. The OpenAPI contract models
    # optional fields by absence (not nullability), so an optional field must
    # serialize as an omitted key, not an explicit null. Emitting null breaks
    # strict generated clients — the ai-assistant's Python client calls
    # UUID(value) on any present key and raises on UUID(None), which surfaced as
    # a 502 on patient-scoped AI queries.
    default-property-inclusion: non_null
  # Render errors as RFC 9457 application/problem+json, matching the API contract.
  mvc:
    problemdetails:
      enabled: true
  # SMTP delivery. Defaults target a local Mailpit (no auth, no TLS); a real
  # provider is purely an SMTP_*/MAIL_* config change.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          # Finite timeouts (ms) so a slow/unresponsive SMTP server can't block
          # the request thread or the reminder scheduler indefinitely.
          connectiontimeout: ${SMTP_CONNECT_TIMEOUT_MS:5000}
          timeout: ${SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}
          starttls:
            enable: ${SMTP_STARTTLS:false}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
    username: ${DB_USER:caredesk}
    password: ${DB_PASSWORD:caredesk}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # `validate` is the production-safe default. It will fail to boot if the
      # notification_db schema is missing, which is intentional in production.
      # Dev compose and prod compose both override this with
      # SPRING_JPA_HIBERNATE_DDL_AUTO=update so the schema is created on first
      # boot against a fresh Postgres. See docker-compose.yml.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Actuator health is permitted in SecurityConfig for the Docker healthcheck;
# prometheus is permitted there too and scraped by Prometheus.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    distribution:
      # Emit http_server_requests_seconds_bucket so Grafana's p95 latency alert
      # (histogram_quantile in infra/grafana/provisioning/alerting/alerts.yaml)
      # has buckets to read. Without this Micrometer only exports _count/_sum and
      # the p95 rule sits at NoData forever.
      percentiles-histogram:
        http.server.requests: true
    tags:
      # Deployed version (image tag), injected as APP_VERSION by Helm/compose.
      # Tags every metric so changes can be correlated with releases in Grafana.
      version: ${APP_VERSION:unknown}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} correlationId=%X{correlationId:-none} logger=%logger{36} message=%msg%n%wEx"
