server:
  port: 8082

# Gateway owns the /api/v1 prefix — this service exposes /patients/**, /doctors/**,
# /appointments/**, /clinics/** directly.
openapi:
  careDesk:
    base-path: ""

auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}

# Internal notification-service URL for best-effort booking-confirmation triggers.
notification-service:
  url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}

spring:
  application:
    name: patient-service
  jackson:
    # Omit null properties from JSON responses. The OpenAPI contract models
    # optional fields by absence (e.g. UserProfile.clinicId is optional and NOT
    # nullable), so a patient with no clinic must serialize as an omitted key,
    # not "clinicId": null. Emitting an explicit null breaks strict generated
    # clients — the ai-assistant's Python client calls UUID(clinicId) on any
    # present key and raises on UUID(None), which surfaced as a 502 on every
    # patient-scoped AI query.
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:patient_db}
    username: ${DB_USER:caredesk}
    password: ${DB_PASSWORD:caredesk}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # `validate` is the production-safe default. It will fail to boot if the
      # patient_db schema is missing, which is intentional in production.
      # Dev compose and prod compose both override this with
      # SPRING_JPA_HIBERNATE_DDL_AUTO=update so the schema is created on first
      # boot against a fresh Postgres. See docker-compose.yml.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Actuator health and prometheus are permitted in SecurityConfig for Docker healthcheck and scraping.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    distribution:
      # Emit http_server_requests_seconds_bucket so Grafana's p95 latency alert
      # (histogram_quantile in infra/grafana/provisioning/alerting/alerts.yaml)
      # has buckets to read. Without this Micrometer only exports _count/_sum and
      # the p95 rule sits at NoData forever.
      percentiles-histogram:
        http.server.requests: true
    tags:
      # Deployed version (image tag), injected as APP_VERSION by Helm/compose.
      # Tags every metric so changes can be correlated with releases in Grafana.
      version: ${APP_VERSION:unknown}
  tracing:
    sampling:
      # Share of requests traced. 1.0 (every request) is fine at this traffic
      # volume; drop it before this ever sees production-scale load.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Tempo's OTLP/HTTP receiver, injected by Helm/compose. Unreachable when
      # Tempo isn't deployed — the exporter just logs failed exports, same
      # tolerance as a scrape target being down.
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} correlationId=%X{correlationId:-none} logger=%logger{36} message=%msg%n%wEx"
