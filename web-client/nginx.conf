server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve /config.js — generated at container start by docker-entrypoint.sh
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Keep direct container access same-origin in Docker Compose.
    # In Kubernetes, this path is unreachable from outside (ingress routes /api/v1
    # to the API gateway directly). The `resolver` + variable indirection defers
    # DNS lookup to request-time, so nginx still boots when `api-gateway` is absent.
    location /api/v1/ {
        resolver           127.0.0.11 ipv6=off valid=30s;   # Docker embedded DNS; K8s kube-dns also responds here via search path
        set                $api_upstream "api-gateway";
        proxy_pass         http://$api_upstream:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # Static assets: cache aggressively (Vite hashes filenames)
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
